[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jsoncargo"
version = "0.1.2"
description = "Python client for the JSONCargo container tracking API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]
keywords = ["container", "tracking", "shipping", "maritime", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://jsoncargo.com"
Documentation = "https://jsoncargo.com/documentation-api/"
Repository = "https://github.com/jsoncargo/jsoncargo-python"

[tool.setuptools]
packages = ["jsoncargo"]
